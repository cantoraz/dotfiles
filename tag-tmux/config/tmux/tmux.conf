# vim: ft=tmux

########################################################################
# Terminal
########################################################################

# Enable 256-color (8-bit) and true-color (24-bit) support in tmux
# set    default-terminal    'tmux-256color'    # set terminal type for 256-color support
# set -a terminal-overrides  ',*256col*:Tc'     # Override to enable true-color for compatible terminals

########################################################################
# Prefix Key
########################################################################

unbind -n C-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

########################################################################
# General
########################################################################

set    escape-time 0          # tmux-sensible: Address vim mode switching delay (http://superuser.com/a/252717/65504) (default: 10)
set    focus-events on        # tmux-sensible: Focus events enabled for terminals that support them
set    set-clipboard on       # Use system clipboard
set -g aggressive-resize on   # tmux-sensible: Super useful when using "grouped sessions" and multi-monitor setup
set -g detach-on-destroy off  # Don't exit from tmux when closing a session
set -g display-panes-time 200 # Decrease tmux pane indicators display duration from 1s to 200ms
set -g display-time 3000      # Increase tmux messages display duration from 750ms to 3s
set -g history-limit 50000    # tmux-sensible: Increase scrollback buffer size from 2000 to 50000 lines
set -g mouse on               # Enable mouse support
set -g set-titles on          # Set the client terminal title
set -g set-titles-string "#S:#I:#W.#P#{?#{!=:#{pane_title},#h}, {#T#},} #{session_alerts}"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on    # Automatically renumber windows when one is closed

# Status line
set -g status-interval 5        # tmux-sensible: Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-justify centre
set -g status-position top
set -g status-left-length 100   # default: 10
set -g status-right-length 100  # default: 10

# Refresh tmux config
bind R { source "~/.config/tmux/tmux.conf" ; display 'Sourced configuration file!' }

# List key bindings in all key tables
bind M-? lsk

########################################################################
# Manipulate Pane
########################################################################

# Split horizontally in CWD
unbind %
bind | { displayp ; splitw -h -c '#{pane_current_path}' }

# Split vertically in CWD
unbind \"
bind - { displayp ; splitw -v -c '#{pane_current_path}' }

# Select a pane
bind -n M-h { selectp -L ; displayp }
bind -n M-j { selectp -D ; displayp }
bind -n M-k { selectp -U ; displayp }
bind -n M-l { selectp -R ; displayp }

# Move a pane
bind -n M-\{ { swapp -U ; displayp }
bind -n M-\} { swapp -D ; displayp }

# Resize a pane
bind -r C-h resizep -L 5
bind -r C-j resizep -D 5
bind -r C-k resizep -U 5
bind -r C-l resizep -R 5
# Maximize a pane
bind -r F11 resizep -Z

########################################################################
# Manipulate Window
########################################################################

# New window in same path
bind c neww -c '#{pane_current_path}'

# Switch between next/prev window easier and faster
bind -n M-Left prev
bind -n M-Right next
bind -r C-p prev
bind -r C-n next

# Move a window
bind -n M-S-Left  swapw -d -t :-1
bind -n M-S-Right swapw -d -t :+1

########################################################################
# Manipulate Session
########################################################################

# Session menu
bind S menu -T "#[align=centre]#{session_name}" -x M -y W \
    Next n { switchc -n } \
    Previous p { switchc -p } \
    '' \
    Renumber N { movew -r } \
    Rename n { command-prompt -I "#S" { rename "%%" } } \
    '' \
    "New Session" s { new } \
    "New Window" w { neww }

########################################################################
# Copy Mode
########################################################################

# Enable vi mode to allow vim movements
set -g mode-keys vi

# Start selecting text
bind -T copy-mode-vi 'v' send -X begin-selection

# Copy text with
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -selection clipboard'

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Fast scroll through a pane's history
bind C-f    copy-mode -d
bind C-b    copy-mode -u
bind C-d    { copy-mode ; send C-d }
bind C-u    { copy-mode ; send C-u }

########################################################################
# Styles
########################################################################

# Load colors
source -F "#{d:current_file}/colors/tomorrow-hybrid.conf"

# Status line
set -g status-style "fg=#{@fg},bg=#{@bg},us=#{@xlight-bg},underscore"
set -g status-left "  #[fg=#{@tint},bold]#S#[default] @#H "
set -g status-right " #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\
#[italics]#{?#{!=:#{pane_title},#h},{#{=21:pane_title}#} ,}#[default]\
#[fg=#{@magenta}]#{?#{n:pane_mode},[#{s/-mode$//:pane_mode}] ,}#[default]\
%F %R %Z "

# Status line - window
# set -g window-status-style          "bg=#{@xlight-bg}"
set -g window-status-current-style  "fg=#{@on-tint},bg=#{@tint}"
set -g window-status-last-style     "bg=#{@xlight-bg}"
set -g window-status-separator      ''
set -g window-status-bell-style     "fg=#{@red}"
set -g window-status-activity-style "#{?window_activity_flag,fg=#{@yellow},}#{?window_silence_flag,dim,}"
set -g window-status-format         "#{?window_last_flag,•, }#I:#W#{?window_zoomed_flag,󰊓 #{?window_marked_flag,󰈻 ,},#{?window_marked_flag,󰈻 , }}"
set -g window-status-current-format " #I:#W#{?window_zoomed_flag,󰊓 #{?window_marked_flag,󰈻 ,},#{?window_marked_flag,󰈻 , }}"

# Status line - messages and command prompt
set -g  message-style       "fg=#{@on-tint},bg=#{@tint}"
set -gF prompt-cursor-color "#{@on-tint}"

# Clock
set -gF clock-mode-colour "#{@tint}"

# Copy mode
set -g copy-mode-match-style          "fg=#{@bg},bg=#{@bright-yellow}"
set -g copy-mode-current-match-style  "fg=#{@bg},bg=#{@yellow}"
set -g copy-mode-position-style       "fg=#{@on-tint},bg=#{@magenta}"
set -g copy-mode-selection-style      "fg=#{@bg},bg=#{@bright-yellow}"

# Menu
set -g menu-border-style    "fg=#{@tint}"
set -g menu-selected-style  "fg=#{@on-tint},bg=#{@tint}"

# Modes
set -g mode-style "fg=#{@on-tint},bg=#{@tint}"

# Pane
set -g pane-border-style        "fg=#{@xlight-bg}"
set -g pane-active-border-style "fg=#{@tint}"

########################################################################
# List of Plugins
########################################################################

set -g @plugin 'tmux-plugins/tpm'               # Tmux Plugin Manager

set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'btop'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '#{d:current_file}/plugins/tpm/tpm'
